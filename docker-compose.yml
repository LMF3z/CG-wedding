services:
  wedding-invitation:
    build: .
    image: invitation-wedding:latest
    container_name: wedding-invitation
    ports:
      - '3001:3001'
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
